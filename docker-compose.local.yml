name: open-agricola-local
services:
  postgres:
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: agricola
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Initialize local dependencies first}
      POSTGRES_DB: agricola
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricola -d agricola"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  objects-volume-init:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /data"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes:
      - type: volume
        source: object-data
        target: /data
        volume:
          nocopy: true
  objects:
    depends_on:
      objects-volume-init:
        condition: service_completed_successfully
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:?Initialize local dependencies first}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:?Initialize local dependencies first}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: ["/data"]
    ports:
      - "127.0.0.1:${LOCAL_S3_PORT:-59000}:9000"
    volumes:
      - type: volume
        source: object-data
        target: /data
        volume:
          nocopy: true
    restart: unless-stopped
volumes:
  postgres-data:
  object-data:
