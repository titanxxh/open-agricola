# Production deployment with Caddy HTTPS reverse proxy.
#
# Usage:
#   1. Copy deploy/Caddyfile.example to deploy/Caddyfile
#   2. Replace domain name in Caddyfile
#   3. Set CORS_ORIGIN in .env to your GitHub Pages URL
#   4. Public HTTPS traffic is exposed on host port 8443
#   5. docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      target: production
    expose:
      - "5175"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=5175
      - BACKEND_HOST=0.0.0.0
      - PERSIST_ROOMS=sqlite
      - ALLOW_ANONYMOUS_WS=false
      - DB_PATH=./data/open-agricola.db
      - CARD_ART_DIR=./data/card-art
      - REPLAY_NEW_ROOMS_ENABLED=${REPLAY_NEW_ROOMS_ENABLED:-false}
      - REPLAY_VIEWER_BUILD_ID=${REPLAY_VIEWER_BUILD_ID:-}
      - REPLAY_VIEWER_ROOT=${REPLAY_VIEWER_ROOT:-./data/replay-viewers}
      - REPLAY_ASSET_ROOT=${REPLAY_ASSET_ROOT:-./data/replay-assets}
      - REPLAY_REMOVAL_LEDGER_PATH=${REPLAY_REMOVAL_LEDGER_PATH:-./data/replay-removals.jsonl}
      - REPLAY_TRUST_PROXY=true
      - BGA_CDN_BASE_URL=${BGA_CDN_BASE_URL:-}
      - GAME_BUILD_ID=${GAME_BUILD_ID:-}
      - BUG_REPORTS_ENABLED=${BUG_REPORTS_ENABLED:-false}
      - BUG_REPORT_GITHUB_APP_ID=${BUG_REPORT_GITHUB_APP_ID:-}
      - BUG_REPORT_GITHUB_CLIENT_ID=${BUG_REPORT_GITHUB_CLIENT_ID:-}
      - BUG_REPORT_GITHUB_CLIENT_SECRET=${BUG_REPORT_GITHUB_CLIENT_SECRET:-}
      - BUG_REPORT_GITHUB_PRIVATE_KEY=${BUG_REPORT_GITHUB_PRIVATE_KEY:-}
      - BUG_REPORT_GITHUB_WEBHOOK_SECRET=${BUG_REPORT_GITHUB_WEBHOOK_SECRET:-}
      - BUG_REPORT_GITHUB_INSTALLATION_ID=${BUG_REPORT_GITHUB_INSTALLATION_ID:-}
      - BUG_REPORT_GITHUB_REPOSITORY_ID=${BUG_REPORT_GITHUB_REPOSITORY_ID:-}
      - BUG_REPORT_TOKEN_ENCRYPTION_KEYS=${BUG_REPORT_TOKEN_ENCRYPTION_KEYS:-}
      - BUG_REPORT_TOKEN_ACTIVE_KEY_ID=${BUG_REPORT_TOKEN_ACTIVE_KEY_ID:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - ACCOUNT_REGISTRATION_POLICY=${ACCOUNT_REGISTRATION_POLICY:?Set ACCOUNT_REGISTRATION_POLICY explicitly. Use open for first-user bootstrap, then invite_only.}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - GITHUB_UPSTREAM_OWNER=${GITHUB_UPSTREAM_OWNER:-titanxxh}
      - GITHUB_UPSTREAM_REPO=${GITHUB_UPSTREAM_REPO:-open-agricola}
      - WORKSHOP_PR_ENABLED=${WORKSHOP_PR_ENABLED:-false}
      - EMAIL_DELIVERY=${EMAIL_DELIVERY:-log}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:?Set PUBLIC_API_BASE to the public backend origin.}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-}
      - ACCOUNT_GITHUB_OAUTH_CLIENT_ID=${ACCOUNT_GITHUB_OAUTH_CLIENT_ID:-}
      - ACCOUNT_GITHUB_OAUTH_CLIENT_SECRET=${ACCOUNT_GITHUB_OAUTH_CLIENT_SECRET:-}
      - ACCOUNT_GOOGLE_OAUTH_CLIENT_ID=${ACCOUNT_GOOGLE_OAUTH_CLIENT_ID:-}
      - ACCOUNT_GOOGLE_OAUTH_CLIENT_SECRET=${ACCOUNT_GOOGLE_OAUTH_CLIENT_SECRET:-}
    volumes:
      - app-data:/app/data
      - app-output:/app/output
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  app-output:
  caddy-data:
