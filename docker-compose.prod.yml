# Production deployment with Caddy HTTPS reverse proxy.
#
# Usage:
#   1. Copy deploy/Caddyfile.example to deploy/Caddyfile
#   2. Replace domain name in Caddyfile
#   3. Set CORS_ORIGIN in .env to your GitHub Pages URL
#   4. Public HTTPS traffic is exposed on host port 443 (8443 retained for existing clients)
#   5. pnpm install --frozen-lockfile && node --env-file=.env scripts/local-services.mjs
#   6. docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    # Match the deployment account so persistent data stays writable by that account.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    build:
      context: .
      target: production
      args:
        GAME_BUILD_ID: ${GAME_BUILD_ID:-development}
    image: open-agricola:backend
    env_file:
      - ${DEPENDENCIES_ENV_FILE:-./data/dependencies.compose.env}
    networks: [default, dependencies]
    stop_grace_period: 90s
    expose:
      - "5175"
    environment:
      - VALIDATION_DATABASE_URL=${VALIDATION_DATABASE_URL:-}
      - NODE_ENV=production
      - BACKEND_PORT=5175
      - BACKEND_HOST=0.0.0.0
      # Production always exercises both application processes, even if .env selects one for local development.
      - APP_INSTANCES=2
      - ALLOW_ANONYMOUS_WS=false
      - REPLAY_TRUST_PROXY=true
      - BUG_REPORTS_ENABLED=${BUG_REPORTS_ENABLED:-false}
      - BUG_REPORT_GITHUB_APP_ID=${BUG_REPORT_GITHUB_APP_ID:-}
      - BUG_REPORT_GITHUB_CLIENT_ID=${BUG_REPORT_GITHUB_CLIENT_ID:-}
      - BUG_REPORT_GITHUB_CLIENT_SECRET=${BUG_REPORT_GITHUB_CLIENT_SECRET:-}
      - BUG_REPORT_GITHUB_PRIVATE_KEY=${BUG_REPORT_GITHUB_PRIVATE_KEY:-}
      - BUG_REPORT_GITHUB_WEBHOOK_SECRET=${BUG_REPORT_GITHUB_WEBHOOK_SECRET:-}
      - BUG_REPORT_GITHUB_INSTALLATION_ID=${BUG_REPORT_GITHUB_INSTALLATION_ID:-}
      - BUG_REPORT_GITHUB_REPOSITORY_ID=${BUG_REPORT_GITHUB_REPOSITORY_ID:-}
      - BUG_REPORT_TOKEN_ENCRYPTION_KEYS=${BUG_REPORT_TOKEN_ENCRYPTION_KEYS:-}
      - BUG_REPORT_TOKEN_ACTIVE_KEY_ID=${BUG_REPORT_TOKEN_ACTIVE_KEY_ID:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - OBSERVABILITY_BACKUP_MANIFEST=/app/backups/observability.latest.json
      - ADMIN_USERS=${ADMIN_USERS:-}
      - ACCOUNT_REGISTRATION_POLICY=${ACCOUNT_REGISTRATION_POLICY:?Set ACCOUNT_REGISTRATION_POLICY explicitly. Use open for first-user bootstrap, then invite_only.}
      - GITHUB_UPSTREAM_OWNER=${GITHUB_UPSTREAM_OWNER:-titanxxh}
      - GITHUB_UPSTREAM_REPO=${GITHUB_UPSTREAM_REPO:-open-agricola}
      - WORKSHOP_PR_ENABLED=${WORKSHOP_PR_ENABLED:-false}
      - WORKSHOP_REVIEW_GITHUB_APP_ID=${WORKSHOP_REVIEW_GITHUB_APP_ID:-}
      - WORKSHOP_REVIEW_GITHUB_PRIVATE_KEY=${WORKSHOP_REVIEW_GITHUB_PRIVATE_KEY:-}
      - WORKSHOP_REVIEW_GITHUB_INSTALLATION_ID=${WORKSHOP_REVIEW_GITHUB_INSTALLATION_ID:-}
      - WORKSHOP_REVIEW_GITHUB_WEBHOOK_SECRET=${WORKSHOP_REVIEW_GITHUB_WEBHOOK_SECRET:-}
      - EMAIL_DELIVERY=${EMAIL_DELIVERY:-log}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-}
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:?Set PUBLIC_API_BASE to the public backend origin.}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-}
      - ACCOUNT_GITHUB_OAUTH_CLIENT_ID=${ACCOUNT_GITHUB_OAUTH_CLIENT_ID:-}
      - ACCOUNT_GITHUB_OAUTH_CLIENT_SECRET=${ACCOUNT_GITHUB_OAUTH_CLIENT_SECRET:-}
      - ACCOUNT_GOOGLE_OAUTH_CLIENT_ID=${ACCOUNT_GOOGLE_OAUTH_CLIENT_ID:-}
      - ACCOUNT_GOOGLE_OAUTH_CLIENT_SECRET=${ACCOUNT_GOOGLE_OAUTH_CLIENT_SECRET:-}
    volumes:
      - app-output:/app/output
      - ./backups:/app/backups:ro
    restart: unless-stopped

  prometheus:
    extends: { file: docker-compose.yml, service: prometheus }
  grafana:
    extends: { file: docker-compose.yml, service: grafana }
  node-exporter:
    extends: { file: docker-compose.yml, service: node-exporter }

  caddy:
    image: caddy:alpine
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      - XDG_CONFIG_HOME=/data/config
    ports:
      - "80:80"
      - "443:443"
      - "8443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-output:
  caddy-data:

networks:
  dependencies:
    external: true
    name: open-agricola-local_default
