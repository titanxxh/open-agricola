# Production deployment with Caddy HTTPS reverse proxy.
#
# Usage:
#   1. Copy deploy/Caddyfile.example to deploy/Caddyfile
#   2. Replace domain name in Caddyfile
#   3. Set CORS_ORIGIN in .env to your GitHub Pages URL
#   4. docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build: .
    expose:
      - "5175"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=5175
      - BACKEND_HOST=0.0.0.0
      - PERSIST_ROOMS=sqlite
      - ALLOW_ANONYMOUS_WS=false
      - DB_PATH=./data/open-agricola.db
      - CARD_ART_DIR=./data/card-art
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_USERS=${ADMIN_USERS:-}
    volumes:
      - app-data:/app/data
      - app-output:/app/output
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-data:
  app-output:
  caddy-data:
