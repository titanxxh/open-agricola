<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Open Agricola</title>
    <script>
      // Resolve the website background URL synchronously so the browser can start
      // fetching the image while the JS bundle is still being downloaded.
      // Mirrors logic in client/utils/seasonalBackground.ts.
      (function () {
        var base = "__PUBLIC_ASSET_BASE_URL__";
        var version = "__PUBLIC_ASSET_VERSION__";
        var map = {
          1: "winter-2", 2: "winter-3", 3: "spring-1", 4: "spring-2",
          5: "spring-3", 6: "summer-2", 7: "summer-1", 8: "summer-3",
          9: "autumn-1", 10: "autumn-2", 11: "autumn-3", 12: "winter-1",
        };
        var terms = [
          [105, "23xiaohan"], [120, "24dahan"], [204, "01lichun"], [219, "02yushui"],
          [305, "03jingzhe"], [320, "04chunfeng"], [404, "05qingming"], [420, "06guyu"],
          [505, "07lixia"], [521, "08xiaoman"], [605, "09mangzhong"], [621, "10xiazhi"],
          [707, "11xiaoshu"], [723, "12dashu"], [807, "13liqiu"], [823, "14chushu"],
          [907, "15bailu"], [923, "16qiufen"], [1008, "17hanlu"], [1023, "18shuangjiang"],
          [1107, "19lidong"], [1122, "20xiaoxue"], [1207, "21daxue"], [1222, "22dongzhi"],
        ];
        var locale = "zh";
        try {
          var savedLocale = localStorage.getItem("open-agricola-locale-v2");
          if (savedLocale === "zh" || savedLocale === "en") locale = savedLocale;
        } catch (_) {}
        var p = new URLSearchParams(location.search);
        var override = p.get("bg");
        var variant = null;
        var now = new Date();
        if (override !== "none") {
          if (override && /^\d+$/.test(override)) variant = map[+override] || null;
          else if (override && /^(spring|summer|autumn|winter)-[1-3]$/.test(override)) variant = override;
          if (!variant && locale === "zh") {
            var utc8 = new Date(now.getTime() + 8 * 60 * 60 * 1000);
            var day = (utc8.getUTCMonth() + 1) * 100 + utc8.getUTCDate();
            variant = "22dongzhi";
            for (var i = 0; i < terms.length; i += 1) {
              if (day < terms[i][0]) break;
              variant = terms[i][1];
            }
          } else if (!variant) {
            variant = map[now.getMonth() + 1];
          }
        }
        if (variant) {
          var href = base + "assets/website-bg/" + variant + ".webp?v=" + encodeURIComponent(version);
          document.documentElement.style.setProperty("--bg-monthly", 'url("' + href + '")');
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "image"; l.href = href;
          l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-load" class="initial-load" aria-busy="true" aria-live="polite">
        <div class="initial-load-card">
          <h2 class="initial-load-title">Open Agricola</h2>
          <p class="initial-load-text">Loading…</p>
          <div class="initial-load-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12">
            <div class="initial-load-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <style>
      .initial-load {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #f5efe6 0%, #e8dfd0 100%);
        font-family: system-ui, -apple-system, sans-serif;
        color: #5a3a20;
      }
      .initial-load-card {
        background: #fff;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 4px 24px rgba(90, 58, 32, 0.12);
        width: min(520px, calc(100vw - 40px));
        display: flex;
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
      .initial-load-title {
        margin: 0;
        font-size: 24px;
        color: #5a3a20;
      }
      .initial-load-text {
        margin: 0;
        font-size: 16px;
        color: #6b5a48;
      }
      .initial-load-progress {
        height: 6px;
        border-radius: 3px;
        background: #e8dfd0;
        overflow: hidden;
      }
      .initial-load-progress-fill {
        height: 100%;
        width: 12%;
        border-radius: 3px;
        background: #5a3a20;
        animation: initial-load-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes initial-load-pulse {
        from { width: 12%; opacity: 0.85; }
        to { width: 28%; opacity: 1; }
      }
    </style>
    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
