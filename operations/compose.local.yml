name: open-agricola-observability
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    user: "${OBSERVABILITY_UID:-1000}:${OBSERVABILITY_GID:-1000}"
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.listen-address=127.0.0.1:19090"]
    volumes:
      - ${OBSERVABILITY_DATA_DIR:?}/prometheus:/prometheus
      - ${OBSERVABILITY_DATA_DIR:?}/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBSERVABILITY_DATA_DIR:?}/metrics-token:/etc/prometheus/metrics-token:ro
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    user: "${OBSERVABILITY_UID:-1000}:${OBSERVABILITY_GID:-1000}"
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 13000
      GF_SERVER_ROOT_URL: http://127.0.0.1:${BACKEND_PORT:-5175}/ops/
      PROMETHEUS_URL: http://127.0.0.1:19090
    volumes:
      - ${OBSERVABILITY_DATA_DIR:?}/grafana:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.10.2
    network_mode: host
    pid: host
    command: ["--web.listen-address=127.0.0.1:19100", "--path.rootfs=/host", "--collector.disable-defaults", "--collector.cpu", "--collector.meminfo", "--collector.filesystem", "--collector.diskstats", "--collector.netdev", "--collector.loadavg"]
    volumes: ["/:/host:ro,rslave"]
    read_only: true
    restart: unless-stopped
