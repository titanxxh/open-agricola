<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X-Deck 交互草图</title>
<!-- PROTOTYPE · throwaway (#1554). Interaction table plus operable scenes; built on the Legendairy Forest interaction prototype (#1542). -->
<style>
/* Layout: dark prototype control strip; below, a mock screen (left) beside an "integration" card (right); phone = one column.
   Plum --lf marks Legendairy Forest; tag colours encode reuse / small change / new. */
:root{
  --bg:#efe6cf; --paper:#fdf6e3; --card:#fffdf7; --ink:#1e1e1e; --ink2:#5a3a20; --muted:#7f6e55;
  --line:#cdb996; --line2:#e8d5b7; --green:#3a5a2c; --on-green:#fff; --green-bg:#e4eed6; --gold:#b9860c; --gold-bg:#fff1cf;
  --lf:#5d3f73; --on-lf:#fff; --lf-bg:#f2e9f6; --lf-line:#cbb3d8; --p1:#c0392b; --p2:#2e5fa8; --p3:#7a6a14;
  --bad:#b03a2e; --bad-bg:#fbe5e1; --reuse:#2d6a3e; --reuse-bg:#e1f0e3; --tweak:#8a5a00; --tweak-bg:#fbefd2; --new:#5d3f73; --new-bg:#efe3f6;
  --ctrl:#20291b; --ctrl-fg:#f2ead6; --ctrl-line:#3c4a33; --burnt:#4a3426; --on-burnt:#f3d9c4;
  --shadow:0 1px 2px rgba(60,40,10,.14),0 6px 18px rgba(60,40,10,.10);
  --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17150f; --paper:#221f17; --card:#2b271d; --ink:#efe6d2; --ink2:#e2caa6; --muted:#b0a083; --line:#5a4e38; --line2:#41392a;
  --green:#93c178; --on-green:#13200d; --green-bg:#2a3822; --gold:#e6b545; --gold-bg:#3a3018; --lf:#cfaee6; --on-lf:#24142f; --lf-bg:#33283c; --lf-line:#5f4b70;
  --p1:#ec7a69; --p2:#80aaf0; --p3:#d8c46a; --bad:#f08273; --bad-bg:#46241f; --reuse:#8fd29b; --reuse-bg:#213326; --tweak:#e8bd62; --tweak-bg:#3a2f17; --new:#d6b6ec; --new-bg:#35283f;
  --ctrl:#0e120b; --ctrl-fg:#efe6d2; --ctrl-line:#2f3a28; --burnt:#2a1c14; --on-burnt:#e7c6ad; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150f; --paper:#221f17; --card:#2b271d; --ink:#efe6d2; --ink2:#e2caa6; --muted:#b0a083; --line:#5a4e38; --line2:#41392a;
  --green:#93c178; --on-green:#13200d; --green-bg:#2a3822; --gold:#e6b545; --gold-bg:#3a3018; --lf:#cfaee6; --on-lf:#24142f; --lf-bg:#33283c; --lf-line:#5f4b70;
  --p1:#ec7a69; --p2:#80aaf0; --p3:#d8c46a; --bad:#f08273; --bad-bg:#46241f; --reuse:#8fd29b; --reuse-bg:#213326; --tweak:#e8bd62; --tweak-bg:#3a2f17; --new:#d6b6ec; --new-bg:#35283f;
  --ctrl:#0e120b; --ctrl-fg:#efe6d2; --ctrl-line:#2f3a28; --burnt:#2a1c14; --on-burnt:#e7c6ad; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding-left:18px}
.tree{width:11px;height:13px;fill:currentColor;vertical-align:-2px}
.ctrl{position:sticky;top:0;z-index:20;background:var(--ctrl);color:var(--ctrl-fg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctrl h1{font-size:15px;font-weight:650}
.ctrl .tag{font-size:11px;border:1px solid var(--ctrl-line);border-radius:99px;padding:2px 8px;opacity:.85}
.ctrl label{display:flex;gap:6px;align-items:center;font-size:13px}
.ctrl select{background:var(--ctrl);border:1px solid var(--ctrl-line);border-radius:6px;padding:4px 6px;color:var(--ctrl-fg);max-width:230px}
.ctrl .steps{display:flex;gap:6px;align-items:center}
.ctrl .steps button{background:transparent;border:1px solid var(--ctrl-line);border-radius:6px;padding:3px 10px;color:var(--ctrl-fg)}
.ctrl .steps button:disabled{opacity:.35;cursor:default}
.ctrl .hint{margin-top:6px;font-size:12.5px;opacity:.9;max-width:1100px}
.ctrl .fork{background:var(--lf);color:var(--on-lf);border-radius:6px;padding:1px 6px;font-size:12px}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.wrap.m{grid-template-columns:minmax(0,1fr)}
.wrap.frame{grid-template-columns:390px minmax(0,1fr)}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.frame .screen{border:10px solid var(--ctrl);border-radius:30px;max-height:calc(100dvh - 150px)}
.frame .screen .body{overflow:auto}
.shead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:13px}
.shead b{font-size:14px}
.body{padding:12px;display:grid;gap:12px;min-width:0}
.ibar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px;box-shadow:0 -4px 14px rgba(60,40,10,.08)}
.ibar.wait{background:var(--paper)}
.ibar .t{font-weight:650}
.ibar .x{font-size:12.5px;color:var(--muted)}
.bs{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 12px;min-height:38px}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.btn.lfb{background:var(--lf);border-color:var(--lf);color:var(--on-lf);font-weight:600}
.btn.sm{min-height:30px;padding:2px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.err{font-size:12.5px;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:5px 9px}
.ok{font-size:12.5px;color:var(--reuse);background:var(--reuse-bg);border-radius:6px;padding:5px 9px}
.banner{font-size:12.5px;background:var(--lf-bg);border:1px solid var(--lf-line);border-radius:8px;padding:6px 9px;color:var(--ink2)}
.sec h4{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.side{display:grid;gap:12px;position:sticky;top:120px}
.m .side,.frame .side{position:static}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.card h3{font-size:14px}
.card p,.card li{font-size:12.5px;line-height:1.6}
.tagline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:start;font-size:12.5px;line-height:1.55}
.tg{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tg.reuse{background:var(--reuse-bg);color:var(--reuse)}
.tg.tweak{background:var(--tweak-bg);color:var(--tweak)}
.tg.new{background:var(--new-bg);color:var(--new)}
.tg.show{background:var(--line2);color:var(--ink2)}
.rec{font-size:12.5px;border-left:3px solid var(--gold);padding-left:8px;color:var(--ink2)}
/* people */
.members{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.mem{flex:0 0 auto;min-width:118px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 9px;text-align:left;display:grid;gap:2px}
.mem b{font-size:13px;display:flex;gap:5px;align-items:center}
.mem small{font-size:11.5px;color:var(--muted);line-height:1.35}
.mem.sel{outline:2px solid var(--green);background:var(--green-bg)}
.mem.off{opacity:.55}
.mem.lent{border-style:dashed}
.badge{font-size:10.5px;font-weight:650;border-radius:4px;padding:0 5px;display:inline-block}
.badge.lf{background:var(--lf);color:var(--on-lf)}
.badge.held{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold)}
.badge.temp{background:var(--new-bg);color:var(--new)}
.badge.sick{background:var(--bad-bg);color:var(--bad)}
.pawn{display:inline-block;width:11px;height:13px;border-radius:5px 5px 2px 2px;background:currentColor;vertical-align:-2px}
.c-p1{color:var(--p1)} .c-p2{color:var(--p2)} .c-p3{color:var(--p3)}
/* spaces */
.spaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;text-align:left;display:grid;gap:3px;min-height:86px;align-content:start}
.sp b{font-size:13px}
.sp small{font-size:11.5px;color:var(--muted);line-height:1.4}
.sp .q{font-size:11.5px;font-weight:600;color:var(--reuse)}
.sp .q.no{color:var(--bad)}
.sp.taken{opacity:.6}
.sp.cand{outline:2px dashed var(--green);outline-offset:-3px}
.sp.lfsp{border-color:var(--lf)}
.pop{border:1.5px solid var(--lf);background:var(--card);border-radius:10px;padding:10px;display:grid;gap:8px;box-shadow:var(--shadow)}
.opt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;text-align:left;display:grid;gap:2px}
.opt small{font-size:11.5px;color:var(--muted)}
.opt[aria-pressed="true"]{outline:2px solid var(--green);background:var(--green-bg)}
.opt:disabled{opacity:.5;cursor:default}
.opts{display:grid;gap:6px}
/* farm */
.farm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:420px}
.tile{aspect-ratio:1;max-width:100%;border-radius:6px;border:1px solid var(--line2);background:var(--green-bg);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--muted);padding:2px;position:relative;line-height:1.2}
.tile.room{background:var(--gold-bg);color:var(--ink2)}
.tile.field{background:color-mix(in srgb,var(--gold) 28%,var(--paper));color:var(--ink2)}
.tile.pasture{background:color-mix(in srgb,var(--green) 22%,var(--paper));color:var(--ink2)}
.tile.burnt{background:var(--burnt);color:var(--on-burnt);border-color:var(--burnt)}
.tile.fairy{background:var(--lf-bg);color:var(--lf);border:1.5px solid var(--lf)}
.tile.cand{outline:2px dashed var(--green);outline-offset:-3px;cursor:pointer}
.tile.pick{outline:3px solid var(--gold);outline-offset:-3px}
.tile.no{background:repeating-linear-gradient(135deg,var(--line2) 0 5px,var(--card) 5px 10px)}
button.tile{font:inherit;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
/* zones */
.zones{display:grid;gap:8px}
.zone{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;background:var(--card);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.zone .zn{font-size:12.5px;font-weight:600}
.zone .zn small{font-weight:400;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{border:1px dashed var(--line);border-radius:6px;padding:3px 7px;font-size:12px;min-width:58px;text-align:center}
.slot.full{border-style:solid;background:var(--green-bg)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
/* order strip */
.order{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.ord{flex:0 0 auto;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12px;background:var(--card);display:grid;gap:1px;text-align:center}
.ord.done{opacity:.5}
.ord.now{outline:2px solid var(--green)}
.ord.held{border-color:var(--gold);background:var(--gold-bg)}
.log{font-size:12.5px;display:grid;gap:3px}
.log div{border-left:2px solid var(--line2);padding-left:7px}
.log div.lf{border-left-color:var(--lf)}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.cf{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--card);display:grid;gap:2px;min-width:130px;text-align:left}
.cf small{font-size:11.5px;color:var(--muted)}
.cf[aria-pressed="true"]{outline:2px solid var(--bad);background:var(--bad-bg)}
.cf.gone{opacity:.45;text-decoration:line-through}
/* overview table */
.tblwrap{overflow-x:auto}
.ov{width:100%;border-collapse:collapse;font-size:12.5px}
.ov th,.ov td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line2);line-height:1.55}
.ov th{font-size:12px;color:var(--muted);font-weight:600}
.ov td:first-child{font-weight:600}
.ov td:last-child{white-space:nowrap}
.ov .grp td{background:var(--lf-bg);color:var(--lf);font-weight:700}
.ov a{color:var(--lf)}
/* fence svg */
.fence svg{width:100%;max-width:340px;height:auto;display:block}
.fence .cell{fill:var(--green-bg);stroke:var(--line2)}
.fence .old{stroke:var(--ink2);stroke-width:5}
.fence .lbl{font-size:11px;fill:var(--ink)}
.quote{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--card);display:grid;gap:4px;font-size:13px}
.quote b{font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== X-Deck additions ===== */
:root{--xd:#14707a;--on-xd:#fff;--xd-bg:#e1f2f2;--xd-line:#9dcfd2;--candy:#d2477b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--xd:#7fd3da;--on-xd:#0b2224;--xd-bg:#1c3436;--xd-line:#2f5a5d;--candy:#f08ab1}}
:root[data-theme="dark"]{--xd:#7fd3da;--on-xd:#0b2224;--xd-bg:#1c3436;--xd-line:#2f5a5d;--candy:#f08ab1}
.xg{display:inline-block;font-weight:800;font-size:11px;color:var(--xd)}
.sp .mkx{font-size:10.5px;font-weight:650;color:var(--candy)}
.sp.xpick{outline:3px solid var(--xd);outline-offset:1px}
.sp.xsp{border-color:var(--xd);background:var(--xd-bg)}
.stepper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.stp{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:4px 8px;background:var(--card);font-size:13px}
.stp small{color:var(--muted)}
.panelx{border:1.5px solid var(--xd);border-radius:10px;padding:10px;display:grid;gap:6px;background:var(--xd-bg)}
.panelx h4{margin:4px 0 0}
.tile.circle{background:repeating-radial-gradient(circle at 50% 50%,var(--gold-bg) 0 3px,color-mix(in srgb,var(--gold) 40%,var(--paper)) 3px 5px);color:var(--ink2);font-weight:650}
.tile.warnt{outline:3px solid var(--bad);outline-offset:-3px}
.tile.stable{background:var(--card);color:var(--ink2)}
</style>
</head>
<body>
<div class="ctrl" id="ctrl"></div>
<div class="wrap" id="wrap"></div>
<script>
// PROTOTYPE · throwaway. Fixed demo data and replies; no game commands, no rules engine.
// Answers #1554: how each X-Deck cross-player, adoption, farm-placement and rebuild interaction is shown and entered,
// and which ones fit existing choice, farm-position selection, payment, animal-reorg and the Legendairy Forest member bar.
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={p1:'玩家1',p2:'玩家2',p3:'玩家3'};
const pawn=p=>`<span class="pawn c-${p}" aria-hidden="true"></span>`;
const XG='<span class="xg" aria-hidden="true">X</span>';
const SCENES={
 overview:{n:'总表：X-Deck 的交互点',steps:['总表']},
 x16:{n:'指定放置（X16）',steps:['轮到玩家2：交给玩家1 选格','交回玩家2 选人放下','结果']},
 x18:{n:'收养（X18）',steps:['选收养对象','付 5 个货物','对方安置收到的动物','结果'],fork:['甲 分步（交互栏）','乙 合并面板']},
 x17:{n:'放糖果（X17）',steps:['放糖果','之后：用格时移除'],fork:['甲 先选分数再点格','乙 点格时自动算分']},
 x08:{n:'回家前：燃料罐（X08）与草叉（X09）',steps:['X08：选空格','执行该格（不放人）','X09：拿 1 个货物']},
 merchant:{n:'商人购买（X06）',steps:['用围栏格：after 窗口','支付 2 石','买到后']},
 x03:{n:'变形器（X03）',steps:['选方式','换自己的货物','换累积格']},
 x15:{n:'回家末进贡（X15）',steps:['玩家1 选择（抽牌者先）','玩家2 选择']},
 x22:{n:'冻结与解冻（X22）、反抗军（X24）',steps:['回家时选冻结的成员','第 13 轮开头：可先放他']},
 x23:{n:'麦田怪圈落位（X23）',steps:['选两个相邻格','拆除后整理动物']},
 x21:{n:'烧房与重建（X21）',steps:['烧房后：逐人整理宠物','翻修格：选择重建','选两个相邻空格并支付']},
 x12:{n:'毛球供养（X12）',steps:['喂养结算']},
};
const S={scene:'overview',step:0,viewer:'p1',device:'auto',fork:{x18:0,x17:0}};
let U={};
(function(){const q=new URLSearchParams(location.search);const h=location.hash.slice(1);const sc=q.get('scene')||h;if(SCENES[sc])S.scene=sc;})();
const isM=()=>S.device==='phone'||innerWidth<820;

/* ---------- builders ---------- */
const tag=(k,t)=>`<span class="tg ${k}">${{reuse:'复用',tweak:'小改',new:'新增',show:'仅显示'}[k]}</span><span>${t}</span>`;
function mapCard(items,rec,who){return `<section class="card"><h3>接入现有能力</h3><div class="tagline">${items.map(([k,t])=>tag(k,t)).join('')}</div>${who?`<h3 style="margin-top:4px">谁操作 · 别人看到什么</h3><p>${who}</p>`:''}${rec?`<p class="rec">${rec}</p>`:''}</section>`}
function bar(b){if(!b)return '';return `<div class="ibar ${b.wait?'wait':''}" role="region" aria-label="交互栏"><div class="t">${b.t}</div>${b.x?`<div class="x">${b.x}</div>`:''}${b.body||''}${b.btns?`<div class="bs">${b.btns.map(([l,a,k,dis])=>`<button class="btn ${k||''}" data-a="${a}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`:''}</div>`}
function shead(round,phase,extra){return `<div class="shead"><span><b>第 ${round} 轮 · ${phase}</b>${extra?` · ${extra}`:''}</span><span>你是 ${pawn(S.viewer)} ${P[S.viewer]}</span></div>`}
function member(m,opt={}){return `<button class="mem ${opt.sel?'sel':''} ${m.off?'off':''}" data-a="${opt.act||''}" ${opt.act&&!m.off?'':'disabled'} aria-pressed="${!!opt.sel}"><b>${pawn(m.owner||'p1')}${esc(m.name)}${(m.badges||[]).map(([k,t])=>` <span class="badge ${k}">${t}</span>`).join('')}</b><small>${esc(m.st||'')}</small></button>`}
function spaces(list,opt={}){return `<div class="spaces">${list.map(s=>{const taken=s.taken;const cand=opt.cand&&opt.cand.includes(s.id);const pick=opt.pick&&opt.pick.includes(s.id);
 const inner=`<b>${esc(s.n)}</b><small>${esc(s.d||'')}</small>${s.mk?`<span class="mkx">${s.mk}</span>`:''}${s.q?`<span class="q ${s.qno?'no':''}">${s.q}</span>`:''}${taken?`<span>${pawn(taken)} 已占</span>`:''}`;
 return cand?`<button class="sp cand ${pick?'xpick':''}" data-a="${opt.act}:${s.id}" aria-pressed="${!!pick}">${inner}</button>`:`<div class="sp ${taken?'taken':''} ${s.x?'xsp':''}">${inner}</div>`}).join('')}</div>`}
function farm(tiles,opt={}){return `<div class="farm" role="group" aria-label="农场">${tiles.map((t,i)=>{
 const cls=['tile',t.k,t.cand?'cand':'',t.pick?'pick':'',t.warn?'warnt':''].join(' ');
 const inner=t.label??{room:'木屋',field:'田',pasture:'牧场',circle:'怪圈',stable:'畜棚'}[t.k]??'';

 const side=mapCard([['tweak','feed 请求加“太空毛球”一行：步进选择留几个，每个 1 食物'],['reuse','家庭成员的喂养、兑换和乞讨照旧；乞讨只抵家庭成员'],['show','实时显示离开数和终局扣分']],'毛球那一行可以随时调整，确认喂养时一并提交。','只有拥有者操作；所有人看到离开数。');
 return {ui:`${shead(9,'收获 · 供养','你的喂养结算')}<div class="body"><div class="quote"><b>食物 ${food}</b> · 家庭需要 ${fam}（2 名成人）</div><div class="stp" style="margin-top:8px"><span>${XG} 太空毛球（X12）：现有 5 个</span><span class="stepper"><button class="btn sm" data-a="keep:-1" ${keep<=0?'disabled':''}>−</button><span>留 ${keep}</span><button class="btn sm" data-a="keep:1" ${keep>=5?'disabled':''}>+</button></span></div><p class="x" style="font-size:12.5px">留 ${keep} 个付 ${keep} 食物；离开 ${5-keep} 个，终局 −${5-keep} 分。${fam+keep>food?'<b style="color:var(--bad)">食物不够：毛球不能用乞讨补。</b>':''}</p></div>${bar({t:'喂养',x:`共需 ${fam+keep} 食物，现有 ${food}。`,btns:[['确认喂养','noop','pri',fam+keep>food]]})}`,side};
};

/* ---------- shell ---------- */
function renderCtrl(){
 const sc=SCENES[S.scene],labels=sc.steps;
 const fork=sc.fork?`<label><span class="fork">方案</span><select id="fork">${sc.fork.map((f,i)=>`<option value="${i}" ${S.fork[S.scene]===i?'selected':''}>${f}</option>`).join('')}</select></label>`:'';
 document.getElementById('ctrl').innerHTML=`<div class="row"><h1>X-Deck 交互草图</h1><span class="tag">原型 · 固定演示数据 · 不连游戏服务</span></div><div class="row" style="margin-top:8px"><label>场景 <select id="scene">${Object.entries(SCENES).map(([k,s])=>`<option value="${k}" ${S.scene===k?'selected':''}>${s.n}</option>`).join('')}</select></label>${S.scene==='overview'?'':`<label>视角 <select id="viewer"><option value="p1" ${S.viewer==='p1'?'selected':''}>玩家1</option><option value="p2" ${S.viewer==='p2'?'selected':''}>玩家2</option></select></label>`}<label>设备 <select id="device"><option value="auto" ${S.device==='auto'?'selected':''}>按窗口宽度</option><option value="phone" ${S.device==='phone'?'selected':''}>手机外框</option></select></label>${fork}${labels.length>1?`<span class="steps"><button data-a="prev" ${S.step===0?'disabled':''} aria-label="上一步">◀</button><span>${S.step+1}/${labels.length} ${labels[S.step]}</span><button data-a="next" ${S.step>=labels.length-1?'disabled':''} aria-label="下一步">▶</button></span>`:''}</div><p class="hint">左边是模拟界面，右边是它接入哪些现有能力。人员交互沿用 Legendairy Forest 已定的成员栏；呈现基线见 #1553。</p>`;
}
function render(){
 renderCtrl();
 const w=document.getElementById('wrap');w.className='wrap'+(S.device==='phone'?' frame':isM()?' m':'');
 const {ui,side}=R[S.scene]();
 w.innerHTML=`<div class="screen">${ui}</div><div class="side">${side}</div>`;
 bind();
}
function go(scene){S.scene=scene;S.step=0;U={};try{history.replaceState(null,'',`${location.pathname}#${scene}`)}catch(e){}render();scrollTo(0,0)}
function act(a){
 const max=SCENES[S.scene].steps.length-1;const [k,x,y]=a.split(':');
 if(a==='next'){if(S.step<max)S.step++;}
 else if(a==='prev'){if(S.step>0)S.step--;if(U.skipped)U={};}
 else if(a==='jump2'){S.step=Math.min(2,max);}
 else if(a==='jump3'){S.step=Math.min(3,max);}
 else if(a==='skip'){U={skipped:true};S.step=max;}
 else if(k==='sp'){U.sp=x;}
 else if(k==='sel'){U.sel=x;}
 else if(k==='pick'){U.pick=x;}
 else if(k==='n'){U.n=+x;U.multi=[];}
 else if(a==='resetn'){U.n=null;U.multi=[];}
 else if(k==='multi'){const s=new Set(U.multi||[]);const lim=S.fork.x17===0?2*(U.n||3):12;if(s.has(x))s.delete(x);else if(s.size<lim)s.add(x);U.multi=[...s];}
 else if(k==='g'){const g={木:0,黏土:0,芦苇:0,石:0,食物:0,羊:0,...(U.goods||{})};g[x]=Math.max(0,g[x]+(+y));U.goods=g;}
 else if(k==='keep'){U.keep=Math.max(0,Math.min(5,(U.keep??4)+(+x)));}
 else if(k==='tile'){const i=+x;const cur=U.pair||[];
  const pairs=S.scene==='x23'?[[3,4],[4,9],[8,9],[13,14],[12,13]]:[[0,5],[5,10],[5,6],[10,11],[6,11]];
  if(cur.includes(i))U.pair=cur.filter(t=>t!==i);
  else if(cur.length===0)U.pair=[i];
  else if(cur.length===1&&pairs.some(p=>p.includes(i)&&p.includes(cur[0])))U.pair=[cur[0],i];
  else U.pair=[i];}
 else if(a==='noop'){return;}
 render();
}
function bind(){
 document.querySelectorAll('[data-a]').forEach(el=>{if(el.dataset.a)el.onclick=e=>{e.preventDefault();act(el.dataset.a)}});
 document.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{e.preventDefault();go(el.dataset.go)});
 const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onchange=fn};
 on('scene',e=>go(e.target.value));
 on('viewer',e=>{S.viewer=e.target.value;render()});
 on('device',e=>{S.device=e.target.value;render()});
 on('fork',e=>{S.fork[S.scene]=+e.target.value;S.step=0;U={};render()});
}
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,120)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SCENES[h]&&h!==S.scene)go(h)});
render();
</script>
</body>
</html>
