<meta charset="utf-8">
<title>Legendairy Forest 牌区草图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Layout: dark prototype control strip, then a mock game page (desktop: board | farm | rail+log; phone: one column).
   Legendairy Forest surfaces use the plum --lf hue so they read apart from the green base board. */
:root{
  --bg:#efe6cf; --paper:#fdf6e3; --card:#fffdf7; --ink:#1e1e1e; --ink2:#5a3a20; --muted:#7f6e55;
  --line:#cdb996; --line2:#e8d5b7; --board:#88a862; --board-ink:#23361a;
  --green:#3a5a2c; --on-green:#ffffff; --green-bg:#e4eed6; --gold:#b9860c; --gold-bg:#fff1cf;
  --lf:#5d3f73; --on-lf:#ffffff; --lf-bg:#f2e9f6; --lf-line:#cbb3d8;
  --p1:#c0392b; --p2:#2e5fa8; --danger:#b03a2e; --danger-bg:#fbe5e1;
  --ctrl:#20291b; --ctrl-fg:#f2ead6; --ctrl-line:#3c4a33; --scrim:rgba(24,18,8,.48);
  --shadow:0 1px 2px rgba(60,40,10,.14),0 6px 18px rgba(60,40,10,.10);
  --font:"Inter","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17150f; --paper:#221f17; --card:#2b271d; --ink:#efe6d2; --ink2:#e2caa6; --muted:#b0a083;
  --line:#5a4e38; --line2:#41392a; --board:#34472a; --board-ink:#dfe9d2;
  --green:#93c178; --on-green:#13200d; --green-bg:#2a3822; --gold:#e6b545; --gold-bg:#3a3018;
  --lf:#cfaee6; --on-lf:#24142f; --lf-bg:#33283c; --lf-line:#5f4b70;
  --p1:#ec7a69; --p2:#80aaf0; --danger:#f08273; --danger-bg:#46241f;
  --ctrl:#0e120b; --ctrl-fg:#efe6d2; --ctrl-line:#2f3a28; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17150f; --paper:#221f17; --card:#2b271d; --ink:#efe6d2; --ink2:#e2caa6; --muted:#b0a083;
  --line:#5a4e38; --line2:#41392a; --board:#34472a; --board-ink:#dfe9d2;
  --green:#93c178; --on-green:#13200d; --green-bg:#2a3822; --gold:#e6b545; --gold-bg:#3a3018;
  --lf:#cfaee6; --on-lf:#24142f; --lf-bg:#33283c; --lf-line:#5f4b70;
  --p1:#ec7a69; --p2:#80aaf0; --danger:#f08273; --danger-bg:#46241f;
  --ctrl:#0e120b; --ctrl-fg:#efe6d2; --ctrl-line:#2f3a28; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding-left:18px}
.tree{width:11px;height:13px;fill:currentColor;vertical-align:-2px;flex:none}

/* prototype controls */
.ctrl{position:relative;z-index:70;background:var(--ctrl);color:var(--ctrl-fg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ctrl h1{font-size:15px;font-weight:650;letter-spacing:.02em;margin-right:6px}
.ctrl .tag{font-size:11px;border:1px solid var(--ctrl-line);border-radius:99px;padding:2px 8px;opacity:.85}
.ctrl label{display:flex;gap:6px;align-items:center;font-size:13px}
.ctrl select{background:var(--ctrl);border:1px solid var(--ctrl-line);border-radius:6px;padding:4px 6px;color:var(--ctrl-fg);max-width:220px}
.ctrl .steps{display:flex;gap:6px;align-items:center}
.ctrl .steps button{background:transparent;border:1px solid var(--ctrl-line);border-radius:6px;padding:3px 10px;color:var(--ctrl-fg)}
.ctrl .steps button:disabled{opacity:.35;cursor:default}
.ctrl .steplabel{font-size:13px;font-variant-numeric:tabular-nums}
.ctrl .hint{margin-top:8px;font-size:12.5px;line-height:1.6;opacity:.9;max-width:1100px}
.ctrl .hint b{color:var(--gold)}

/* variant switcher pill (prototype chrome) */
.vpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:4px;background:var(--ctrl);color:var(--ctrl-fg);border-radius:99px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;white-space:nowrap}
.vpill button{background:transparent;border:0;color:inherit;width:34px;height:34px;border-radius:50%;font-size:16px}
.vpill button:hover{background:var(--ctrl-line)}
.vpill span{padding:0 6px;font-variant-numeric:tabular-nums}

/* stage around the mock app */
.stage{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{position:relative;max-width:1360px;margin:0 auto}
.shell.frame{width:390px;max-width:100%;height:min(820px,calc(100dvh - 190px));min-height:520px;border:10px solid var(--ctrl);border-radius:32px;overflow:hidden;transform:translateZ(0);background:var(--paper);box-shadow:var(--shadow)}
.shell.frame .scroller{height:100%;overflow:auto;padding:0 10px 150px}
.shell:not(.frame) .scroller{padding-bottom:120px}
.flayer>*{position:fixed}
.frame .flayer>*{position:absolute}

/* mock game chrome */
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px}
.ghead strong{font-size:15px}
.ghead .who{font-size:12px;color:var(--muted)}
.stagebar{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;margin:8px 0}
.stagebar span{font-size:11px;text-align:center;border-radius:4px;padding:2px 0;background:var(--line2);color:var(--muted);font-variant-numeric:tabular-nums}
.stagebar span.past{background:var(--green-bg);color:var(--green)}
.stagebar span.now{background:var(--green);color:var(--on-green);font-weight:650}
.stagebar span.h{box-shadow:inset 0 -2px 0 var(--gold)}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(250px,.8fr);gap:12px;align-items:start}
.m .cols{display:flex;flex-direction:column;gap:10px}
.col{display:grid;gap:12px;min-width:0}
.m .col{gap:10px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.panel>h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.panel h4{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:12px 0 6px}
.sub{font-size:12px;color:var(--muted);font-weight:400}

/* action board */
.board{background:var(--board);border-radius:12px;padding:10px;color:var(--board-ink)}
.board .bh{display:flex;justify-content:space-between;font-size:12px;margin:2px 2px 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.m .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.m .rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.sp{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 7px;min-height:74px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sp b{font-size:12.5px;line-height:1.3}
.sp small{font-size:11px;color:var(--muted);line-height:1.35}
.sp .goods{font-size:11.5px;font-weight:600;color:var(--ink2)}
.sp .rn{position:absolute;top:4px;right:6px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.sp.future{background:transparent;border:1px dashed var(--board-ink);color:var(--board-ink);opacity:.75;align-items:center;justify-content:center;text-align:center}
.sp.future small{color:inherit}
.sp.hl{outline:3px solid var(--gold);outline-offset:1px}
.sp.withdrawn{background:repeating-linear-gradient(135deg,var(--line2) 0 6px,var(--card) 6px 12px)}
.sp.withdrawn b{text-decoration:line-through;text-decoration-thickness:1.5px}
.stamp{display:inline-flex;gap:4px;align-items:center;font-size:10.5px;font-weight:650;color:var(--lf);background:var(--lf-bg);border:1px solid var(--lf-line);border-radius:4px;padding:1px 5px;align-self:flex-start;line-height:1.4}
.sp.lfsp{border:1.5px solid var(--lf);background:linear-gradient(var(--lf-bg),var(--card) 60%)}
.sp .badge{font-size:10px;color:var(--on-lf);background:var(--lf);border-radius:3px;padding:0 4px;align-self:flex-start;display:inline-flex;gap:3px;align-items:center}
.note-gold{font-size:10.5px;color:var(--gold);font-weight:600;line-height:1.35}
.mp{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}
.mp i{display:inline-block;width:11px;height:13px;border-radius:5px 5px 2px 2px;position:relative;background:currentColor}
.mp.p1{color:var(--p1)} .mp.p2{color:var(--p2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)}
.cardrow{margin-top:10px;background:var(--paper);border-radius:9px;padding:8px;color:var(--ink)}
.cardrow h4{margin:0 0 6px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.hscroll>*{flex:0 0 150px}

/* card faces */
.cf{background:var(--card);border:1px solid var(--lf-line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--ink)}
.cf .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--lf);font-weight:650}
.cf .nm{font-weight:650;font-size:13px;line-height:1.3}
.cf .tx{font-size:11.5px;color:var(--muted);line-height:1.45}
.cf .dest{font-size:10.5px;color:var(--ink2);border-top:1px dashed var(--line2);padding-top:4px;margin-top:auto}
.cf.lg{padding:14px;gap:8px;border:2px solid var(--lf);box-shadow:var(--shadow)}
.cf.lg .nm{font-size:20px}
.cf.lg .tx{font-size:13.5px}
.cf.mini{padding:5px 7px;gap:2px}
.cf.mini .nm{font-size:12px}
.typ{font-size:10.5px;border:1px solid var(--lf-line);border-radius:3px;padding:0 4px;color:var(--lf);font-weight:500}
.back{background:repeating-linear-gradient(45deg,var(--lf) 0 5px,color-mix(in srgb,var(--lf) 80%,var(--paper)) 5px 10px);border-radius:8px;border:2px solid var(--lf-line);display:grid;place-items:center;color:var(--on-lf);font-weight:700;font-size:13px;text-align:center;line-height:1.3}

/* farm & players */
.farm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tile{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--green-bg);border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.tile.room{background:var(--gold-bg);color:var(--ink2)}
.tile.field{background:color-mix(in srgb,var(--gold) 28%,var(--paper));color:var(--ink2)}
.tile.plow{outline:2px dashed var(--gold);outline-offset:-3px}
.owned{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.owned .cf{flex:1 1 140px;max-width:220px}
.lfmark{display:inline-flex;gap:3px;align-items:center;font-size:10.5px;color:var(--lf);font-weight:600}
.markers{letter-spacing:2px;color:var(--lf);font-size:12px}
.plist{display:grid;gap:6px}
.prow{display:grid;gap:3px;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--card)}
.prow .pn{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.prow .res{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.prow.act{border-color:var(--green)}
.crown{font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 6px;font-weight:650;white-space:nowrap;align-self:start}
.m .players-strip .plist{grid-template-columns:1fr 1fr}

/* log */
.log{display:grid;gap:2px;max-height:360px;overflow:auto;font-size:12.5px}
.m .log{max-height:none}
.log .rh{font-size:11px;color:var(--muted);font-weight:650;margin-top:6px;letter-spacing:.04em}
.log .le{padding:2px 0 2px 8px;border-left:2px solid var(--line2);line-height:1.5}
.log .le.lf{border-left-color:var(--lf)}
.log .le .src{color:var(--lf);font-weight:600}
.chips{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--lf);color:var(--on-lf);border-color:var(--lf)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 12px;min-height:36px}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:600}
.btn.lfb{background:var(--lf);border-color:var(--lf);color:var(--on-lf);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:30px;padding:3px 9px;font-size:12px}
.linkbtn{background:none;border:0;color:var(--lf);padding:0;text-decoration:underline;font-size:12px}

/* interaction bar */
.ibar{left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 32px));z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:6px}
.frame .ibar{bottom:8px;width:calc(100% - 16px)}
.ibar .t{font-weight:650;font-size:13.5px}
.ibar .x{font-size:12.5px;color:var(--muted);line-height:1.5}
.ibar .bs{display:flex;gap:8px;flex-wrap:wrap}
.ibar.wait{background:var(--paper)}
.tlist{display:grid;gap:4px;font-size:12.5px}
.tlist div{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;background:var(--paper)}
.tlist .must{color:var(--lf);font-weight:600}

/* toasts */
.toasts{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:40;display:grid;gap:8px;width:min(360px,calc(100% - 32px))}
.frame .toasts{top:8px;right:8px;width:calc(100% - 16px)}
.toast{background:var(--card);border:1px solid var(--lf-line);border-left:4px solid var(--lf);border-radius:9px;padding:9px 11px;box-shadow:var(--shadow);font-size:13px;display:grid;gap:4px;animation:drop .35s ease-out}
.toast .tt{display:flex;justify-content:space-between;gap:8px;align-items:start}
@keyframes drop{from{transform:translateY(-8px);opacity:.3}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lf) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.glow{animation:glow 1.2s ease-out 2}
@keyframes flyin{from{transform:translateX(-40px) rotateY(80deg);opacity:0}}
.flyin{animation:flyin .5s ease-out}
@media (prefers-reduced-motion:reduce){.toast,.glow,.flyin{animation:none}}

/* overlays */
.scrim{inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;width:min(620px,100%);max-height:100%;overflow:auto;display:grid;gap:12px}
.modal h2{font-size:17px}
.peek{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.m .peek,.frame .peek{grid-template-columns:1fr}
.peek .slot{display:grid;gap:6px}
.peek .pos{font-size:11px;font-weight:650;color:var(--lf)}
.peek .mv{display:flex;gap:6px}
.privacy{font-size:12px;color:var(--ink2);background:var(--gold-bg);border-radius:6px;padding:6px 9px;line-height:1.5}
.memo{font-size:12px;border:1px dashed var(--lf);border-radius:8px;padding:7px 9px;color:var(--ink2);background:var(--lf-bg);line-height:1.55}

/* A: expansion panel */
.lfA{border-color:var(--lf-line);background:linear-gradient(var(--lf-bg),var(--paper) 140px)}
.lfA>h3{color:var(--lf)}
.lfA-top{display:grid;grid-template-columns:96px minmax(0,1fr) 96px;gap:10px;align-items:stretch}
.m .lfA-top{grid-template-columns:80px minmax(0,1fr)}
.m .lfA-top .disc{grid-column:1/-1}
.deckbox{display:grid;gap:4px;align-content:start;font-size:11.5px;color:var(--muted);text-align:center}
.deckbox .back{height:112px}
.m .deckbox .back{height:96px}
.slotA{border:1.5px dashed var(--lf-line);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.slotA .cap{font-size:11.5px;color:var(--muted)}
.status{font-size:11px;font-weight:650;border-radius:99px;padding:1px 8px;justify-self:start}
.status.res{background:var(--gold-bg);color:var(--gold)}
.status.done{background:var(--green-bg);color:var(--green)}
.res-lines{font-size:12px;line-height:1.55;color:var(--ink2);padding-left:16px}
.rules{list-style:none;padding:0;display:grid;gap:6px}
.rule{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 9px;display:grid;gap:2px}
.rule .rt{font-weight:650;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rule .rx{font-size:11.5px;color:var(--muted);line-height:1.45}
.srcchip{font-size:10.5px;font-weight:600;color:var(--lf);white-space:nowrap}
.lfspaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.discbox{display:grid;gap:4px;align-content:start;text-align:center;font-size:11.5px;color:var(--muted)}
.discbox .back{height:70px;background:var(--line2);color:var(--muted);border-color:var(--line)}

/* B: stage + rail */
.stageB{width:min(520px,100%);background:var(--paper);border-radius:16px;border:2px solid var(--lf);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow);max-height:100%;overflow:auto}
.stageB .who{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stageB .kick{font-size:11px;letter-spacing:.12em;color:var(--lf);font-weight:700}
.railB{border-color:var(--lf-line)}
.railB>h3{color:var(--lf)}
.deckline{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.drawtbl{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.drawtbl th,.drawtbl td{text-align:left;padding:3px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.drawtbl th{color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
.fab{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--lf);color:var(--on-lf);border:0;border-radius:99px;padding:9px 14px;font-weight:650;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.frame .fab{bottom:150px}
.sheet{left:0;right:0;bottom:0;z-index:55;background:var(--paper);border-radius:16px 16px 0 0;border-top:2px solid var(--lf);max-height:78%;overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-scrim{inset:0;background:var(--scrim);z-index:54}

/* C: track */
.trackC{background:var(--lf-bg);border:1px solid var(--lf-line);border-radius:12px;padding:10px;display:grid;grid-template-columns:110px 24px minmax(160px,1fr) 24px minmax(0,2.6fr) 96px;gap:8px;align-items:stretch;margin-bottom:8px}
.trackC .arrow{display:grid;place-items:center;color:var(--lf);font-size:18px}
.zone{display:grid;gap:5px;align-content:start;min-width:0}
.zone .zh{font-size:11px;font-weight:700;color:var(--lf);letter-spacing:.06em;display:flex;justify-content:space-between;gap:6px}
.zone .back{height:96px}

 unowned:[{src:'26',label:'羊驼',ev:['3 只 → +1','0 只 → -1'],pts:[1,-1]},{src:'20',label:'妖精最多',ev:['4 个，最多 → +5','1 个 → 0'],pts:[5,0]}],
 own:[{src:'18',label:'奖励分 · 使用战斗公主',ev:['1 次 → +5','—'],pts:[5,0]},{src:'16',label:'火沼烈焰喷射烤炉',ev:['+1','—'],pts:[1,0]},{src:'03',label:'独角兽(第二部)',ev:['—','-3'],pts:[0,-3]}]};
function scorePad(){
 const v=S.variant,sumBase=i=>SCORE.base.reduce((a,r)=>a+r[i+1],0);
 const tot=i=>sumBase(i)+SCORE.unowned.reduce((a,r)=>a+r.pts[i],0)+SCORE.own.reduce((a,r)=>a+r.pts[i],0);
 const baseRows=SCORE.base.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
 const row=(r,label)=>`<tr><td>${label}</td><td>${r.pts[0]} <small>${r.ev[0]}</small></td><td>${r.pts[1]} <small>${r.ev[1]}</small></td></tr>`;
 let body;

 else if(v==='B'){body=`<table class="score"><thead><tr><th>项目</th><th>${P.p1}</th><th>${P.p2}</th></tr></thead><tbody>${baseRows}${SCORE.own.map(r=>row(r,`${r.label}<br>${srcChip(r.src,r.src==='18'?'用格所得':'自己的牌')}`)).join('')}${SCORE.unowned.map(r=>row(r,`${r.label}<br>${srcChip(r.src,'无主 · 公共牌区')}`)).join('')}<tr class="tot"><td>合计</td><td>${tot(0)}</td><td>${tot(1)}</td></tr></tbody></table>`;}
 else{body=`<table class="score"><thead><tr><th>项目</th><th>${P.p1}</th><th>${P.p2}</th></tr></thead><tbody>${baseRows}${SCORE.own.map(r=>row(r,`${r.label} <small>${r.src}</small>`)).join('')}<tr><td>无主牌规则 <small>见下</small></td><td>${SCORE.unowned.reduce((a,r)=>a+r.pts[0],0)}</td><td>${SCORE.unowned.reduce((a,r)=>a+r.pts[1],0)}</td></tr><tr class="tot"><td>合计</td><td>${tot(0)}</td><td>${tot(1)}</td></tr></tbody></table><h4>${TREE} 无主牌规则 · 对每名玩家分别计分</h4><div class="unowned">${SCORE.unowned.map(r=>`<div class="u">${cardFace(r.src,'mini')}<div class="evals"><div><span>${mp('p1')}</span><span>${r.ev[0]}</span></div><div><span>${mp('p2')}</span><span>${r.ev[1]}</span></div></div></div>`).join('')}</div>`;}
 return `<div class="scrim" role="dialog" aria-modal="true" aria-label="计分板"><div class="modal"><h2>计分板</h2>${body}<div><button class="btn" data-act="score:0">关闭</button></div></div></div>`;
}

// ---------- variant surfaces ----------
function deckBox(w){return `<div class="deckbox"><div class="back">${TREE}<br>${w.deck} 张</div><span>牌堆 · 已洗 ${w.shuffles} 次</span></div>`}
function lfPanelA(w){
 const spaces=w.display.filter(id=>CARDS[id][1]==='space');const others=w.display.filter(id=>CARDS[id][1]!=='space');
 let slot;
 if(w.pending)slot=`<div class="slotA"><span class="status res">即将翻牌</span><div class="cap">${mp(w.pending.by)} 从${w.pending.from}取得 ${w.pending.wood} 木，满足翻牌条件。由${P[w.pending.by]}安排取木后效果的顺序。</div></div>`;
 else if(w.last){const L=w.last;slot=`<div class="slotA ${w.reveal?'glow':''}"><div class="cap">最近翻出 · 第 ${w.round} 轮 · ${mp(L.by)} · ${L.from} ${L.wood} 木</div>${cardFace(L.card,'md',{cls:w.reveal?'flyin':''})}<span class="status ${L.status==='结算中'?'res':'done'}">${L.status}</span>${resultBlock(L)}</div>`;}
 else slot=`<div class="slotA"><div class="cap">从累积格取得至少 3 木时，翻 1 张牌，向所有人公开。</div></div>`;
 const disc=`<div class="discbox disc"><div class="back">弃牌<br>${w.discard.length} 张</div><button class="linkbtn" data-act="disc">${S.discardOpen?'收起':'查看弃牌'}</button></div>`;
 return `<section class="panel lfA"><h3><span>${TREE} Legendairy Forest</span><span class="sub">取 ≥3 木翻 1 张</span></h3><div class="lfA-top">${deckBox(w)}${slot}${disc}</div>${S.discardOpen?`<h4>弃牌</h4><div class="hscroll">${w.discard.map(id=>cardFace(id,'mini')).join('')}</div>`:''}${peekBlock(w,'note')&&S.viewer!=='p1'?`<h4>女巫</h4>${peekBlock(w,'note')}`:''}${w.memo&&S.viewer==='p1'?`<h4>女巫</h4>${peekBlock(w)}`:''}<h4>公共行动格</h4>${spaces.length?`<div class="lfspaces">${spaces.map(id=>spaceTile(lfSpace(id),w)).join('')}</div>`:'<p class="sub">还没有。翻出 17–21 号时出现在这里，当轮就能放人。</p>'}${others.length?`<h4>公共牌区里的其他牌</h4><div class="hscroll">${others.map(id=>cardFace(id,'md',{destText:'持续生效，不洗回'})).join('')}</div>`:''}<h4>持续规则</h4>${rulesList(w)}</section>`;
}
function railB(w,inSheet){
 return `<section class="panel railB"><h3><span>${TREE} Legendairy Forest</span>${inSheet?'<button class="btn sm" data-act="sheet:0">关闭</button>':''}</h3><div class="deckline"><span>牌堆 ${w.deck} 张</span><span>已洗 ${w.shuffles} 次</span><span>弃牌 ${w.discard.length} 张</span></div>${w.pending?`<div class="memo" style="margin-top:8px">${mp(w.pending.by)} 从${w.pending.from}取得 ${w.pending.wood} 木，即将翻牌。</div>`:''}${w.last&&S.stageClosed&&w.reveal?`<div style="margin-top:8px"><button class="linkbtn" data-act="stage:1">再次查看刚翻出的 ${nm(w.last.card)}</button></div>`:''}${(w.peek||w.memo)?`<h4>女巫</h4>${peekBlock(w,'inline')}`:''}<h4>正在生效</h4>${rulesList(w)}<h4>公共牌区</h4>${w.display.length?`<div class="thumbs">${w.display.map(id=>cardFace(id,'mini')).join('')}</div>`:'<p class="sub">空</p>'}<h4>翻牌记录</h4>${drawTable(w)}</section>`;
}
function stageB(w){
 const rv=w.reveal;
 return `<div class="scrim" role="dialog" aria-modal="true" aria-label="Legendairy Forest 翻牌"><div class="stageB"><div class="kick">${TREE} LEGENDAIRY FOREST 翻牌</div><div class="who">${mp(rv.by)} 从${rv.from}取得 ${rv.wood} 木 · 第 ${w.round} 轮</div>${cardFace(rv.card,'lg',{cls:'flyin'})}${resultBlock(rv)}<div class="bs" style="display:flex;gap:8px;flex-wrap:wrap">${S.viewer===rv.by&&w.resolving.length?`<button class="btn pri" data-act="stage:0">去处理</button>`:`<button class="btn pri" data-act="stage:0">收起</button>`}<span class="sub" style="align-self:center">${S.viewer===rv.by?'':'只是展示，不影响你的操作'}</span></div></div></div>`;
}
function trackC(w){
 const res=w.resolving.length?w.resolving:[];
 const resZone=w.pending?`<div class="zone empty"><div class="zh"><span>结算中</span></div><div class="ph">${mp(w.pending.by)} 从${w.pending.from}取得 ${w.pending.wood} 木<br>即将翻牌</div></div>`:
  (w.reveal||res.length)?`<div class="zone glow"><div class="zh"><span>${res.length?'结算中':'刚翻出'}</span><span>${mp(w.reveal?w.reveal.by:'p1')}</span></div>${cardFace((w.reveal||{}).card||res[0],'md',{cls:'flyin'})}${resultBlock(w.reveal)}</div>`:
  `<div class="zone empty"><div class="zh"><span>结算中</span></div><div class="ph">${w.last?`上一张：${nm(w.last.card)}<br>${w.last.status}`:'取 ≥3 木时翻牌'}</div></div>`;
 const disp=`<div class="zone"><div class="zh"><span>公共牌区</span><span>${w.display.length} 张</span></div>${w.display.length?`<div class="disp">${w.display.map(id=>{const r=w.rules.find(x=>x.src===id);return `<div class="dwrap">${cardFace(id,'mini')}${r?`<span class="ruletag">${esc(r.t)}</span>`:CARDS[id][1]==='space'?'<span class="ruletag">公共行动格 · 见行动板</span>':''}</div>`}).join('')}</div>`:'<div class="ph" style="border:1.5px dashed var(--lf-line);border-radius:9px;min-height:60px;display:grid;place-items:center;font-size:12px;color:var(--muted)">空</div>'}</div>`;
 const off=w.rules.filter(r=>r.where==='牌已洗回牌堆');
 const offRow=off.length?`<div class="offcard"><span class="sub">牌已洗回、规则仍生效：</span>${off.map(r=>`<span class="ruletag">${esc(r.t)} · ${TREE} ${r.src}${r.until?` · ${r.until}`:''}</span>`).join('')}</div>`:'';
 const peek=(w.peek||w.memo)?`<div style="grid-column:1/-1">${peekBlock(w,'inline')}</div>`:'';
 return `<section class="trackC" aria-label="Legendairy Forest 牌区"><div class="zone deckz"><div class="zh"><span>${TREE} 牌堆</span><span>洗 ${w.shuffles} 次</span></div><div class="back">${w.deck} 张${w.peek?'<br>👁':''}</div></div><div class="arrow">→</div>${resZone}<div class="arrow">→</div>${disp}<div class="zone"><div class="zh"><span>弃牌</span><span>${w.discard.length}</span></div><button class="back" style="height:70px;background:var(--line2);color:var(--muted);border-color:var(--line)" data-act="disc">${S.discardOpen?'收起':'查看'}</button></div>${S.discardOpen?`<div style="grid-column:1/-1" class="hscroll">${w.discard.map(id=>cardFace(id,'mini')).join('')}</div>`:''}${offRow}${peek}</section>`;
}
function trackMini(w){
 return `<button class="trackMini" data-act="track" aria-expanded="${S.trackOpen}"><span>${TREE} <b>牌堆 ${w.deck}</b> · 结算中 ${w.reveal||w.resolving.length?`<b>${nm((w.reveal||{}).card||w.resolving[0])}</b>`:'—'} · 公共 ${w.display.length} · 弃 ${w.discard.length}${w.rules.length?` · 规则 ${w.rules.length}`:''}</span><span>${S.trackOpen?'收起 ▴':'展开 ▾'}</span></button>`;

// ---------- page assembly ----------
function render(){
 const m=isMobile(),w=world(),v=S.variant;
 renderCtrl();
 const shell=document.getElementById('shell');
 shell.className='shell'+(S.device==='phone'?' frame':'')+(m?' m':'');
 if(S.scene==='setup'&&S.step<2){shell.innerHTML=`<div class="scroller">${lobby()}</div><div class="flayer"></div>`;bind();return;}
 if(S.scene==='setup'&&!S.lobbyOn){shell.innerHTML=`<div class="scroller"><div class="lobby"><section class="panel"><p>本局未启用 Legendairy Forest，对局里不会出现任何相关界面。回到第 1 步勾选后再看。</p></section></div></div><div class="flayer"></div>`;bind();return;}
 const showB=v==='B',showC=v==='C';
 const rowSpaces=showB&&w.display.some(id=>CARDS[id][1]==='space')?`<div class="cardrow"><h4>卡牌行动格</h4><div class="lfspaces">${w.display.filter(id=>CARDS[id][1]==='space').map(id=>spaceTile(lfSpace(id),w)).join('')}</div></div>`:'';
 const boardHtml=board(w,{inline:showC,row:rowSpaces});
 const top=showC?(m?trackMini(w)+(S.trackOpen?trackC(w):''):trackC(w)):'';
 const left=`<div class="col">${boardHtml}${v==='A'?lfPanelA(w):''}</div>`;
 const center=`<div class="col">${farmPanel(w)}</div>`;
 const scoreBtn=`<button class="btn" data-act="score:1">计分板</button>`;
 const right=`<div class="col">${m?'':playersPanel(w)}${showB&&!m?railB(w):''}${scoreBtn}${logPanel(w,showC)}</div>`;
 const page=m?`${header(w)}${playersPanel(w)}${stagebar(w)}${top}${left}${center}${right}`:`${header(w)}${stagebar(w)}${top}<div class="cols">${left}${center}${right}</div>`;
 // floating layer
 let fl='';
 if(v==='A'&&w.reveal&&!S.toastClosed){fl+=`<div class="toasts" role="status"><div class="toast"><div class="tt"><span>${TREE} ${mp(w.reveal.by)} 从${w.reveal.from}取得 ${w.reveal.wood} 木，翻出 <b>${nm(w.reveal.card)}</b></span><button class="linkbtn" data-act="toast:0" aria-label="关闭提示">关闭</button></div><span class="sub">${esc(w.reveal.res[0]||'')}${w.reveal.res.length>1?' 等':''} · 详见 Legendairy Forest 面板</span></div></div>`;}
 if(v==='A'&&w.peek&&S.viewer==='p1'){fl+=`<div class="scrim" role="dialog" aria-modal="true" aria-label="女巫查看牌堆"><div class="modal"><h2>${TREE} 女巫：查看并重排牌堆顶 3 张</h2>${peekBlock(w,'modal')}</div></div>`;}
 if(v==='A'&&w.peek&&S.viewer!=='p1'){fl+=`<div class="toasts" role="status"><div class="toast"><span>${TREE} ${mp('p1')} 正在用女巫查看牌堆顶 3 张 · 剩 ${w.peek.left} 个标志</span></div></div>`;}
 if(v==='B'&&w.reveal&&!S.stageClosed)fl+=stageB(w);
 if(v==='B'&&m){fl+=`<button class="fab" data-act="sheet:1" aria-label="打开 Legendairy Forest 规则栏">${TREE} 牌堆 ${w.deck} · 生效 ${w.rules.length}${w.peek&&S.viewer==='p1'?' · 女巫':''}</button>`;
  if(S.sheetOpen)fl+=`<div class="sheet-scrim" data-act="sheet:0"></div><div class="sheet" role="dialog" aria-label="Legendairy Forest"><div class="grab"></div>${railB(w,true)}</div>`;}
 if(S.scoreOpen)fl+=scorePad();
 fl+=interactionBar(w);
 shell.innerHTML=`<div class="scroller">${page}</div><div class="flayer">${fl}</div>`;

function renderCtrl(){
 const labels=stepLabels();
 const extra=S.scene==='draw'?`<label>翻出 <select id="drawCard">${[['08','08 绿林好汉 · 事件，洗回'],['01','01 湖中仙女(第一部) · 事件，需选择'],['17','17 丰饶之地 · 行动格'],['25','25 伐木工查克 · 职业'],['16','16 烤炉 · 主要发展'],['26','26 秘鲁宗教裁判所 · 持续事件']].map(([k,l])=>`<option value="${k}" ${S.drawCard===k?'selected':''}>${l}</option>`).join('')}</select></label>`:
  S.scene==='replace'?`<label>情况 <select id="replaceCase"><option value="late" ${S.replaceCase==='late'?'selected':''}>已进场（格上有人）</option><option value="early" ${S.replaceCase==='early'?'selected':''}>未进场</option></select></label>`:
  S.scene==='witch'?`<label><input type="checkbox" id="witchLast" ${S.witchLast?'checked':''}> 最后 1 个标志</label>`:'';
 document.getElementById('ctrl').innerHTML=`<div class="ctrl-row"><h1>Legendairy Forest 牌区草图</h1><span class="tag">原型 · 固定演示数据 · 不连游戏服务</span></div>
 <div class="ctrl-row" style="margin-top:8px"><label>场景 <select id="scene">${Object.entries(SCENES).map(([k,l])=>`<option value="${k}" ${S.scene===k?'selected':''}>${l}</option>`).join('')}</select></label>
 <label>视角 <select id="viewer"><option value="p1" ${S.viewer==='p1'?'selected':''}>玩家1</option><option value="p2" ${S.viewer==='p2'?'selected':''}>玩家2</option></select></label>
 <label>设备 <select id="device"><option value="auto" ${S.device==='auto'?'selected':''}>按窗口宽度</option><option value="phone" ${S.device==='phone'?'selected':''}>手机外框</option></select></label>
 ${extra}
 <span class="steps"><button data-act="prev" ${S.step===0?'disabled':''} aria-label="上一步">◀</button><span class="steplabel">${S.step+1}/${labels.length} ${labels[S.step]}</span><button data-act="next" ${S.step>=labels.length-1?'disabled':''} aria-label="下一步">▶</button></span></div>
 <p class="hint">${VDESC[S.variant]}<br>${SHINT[S.scene]}</p>`;
 document.getElementById('vpill').innerHTML=`<button data-act="vprev" aria-label="上一个方案">‹</button><span>${S.variant} · ${VARIANTS[S.variant]}</span><button data-act="vnext" aria-label="下一个方案">›</button>`;
}
function resetTransient(){S.stageClosed=false;S.toastClosed=false;S.sheetOpen=false;S.scoreOpen=S.scene==='log';}
function act(a){
 const max=stepLabels().length-1;
 if(a==='next'){if(S.step<max){S.step++;resetTransient();}}
 else if(a==='prev'){if(S.step>0){S.step--;resetTransient();}}
 else if(a==='vnext'||a==='vprev'){const ks=Object.keys(VARIANTS);S.variant=ks[(ks.indexOf(S.variant)+(a==='vnext'?1:ks.length-1))%ks.length];resetTransient();writeUrl();}
 else if(a==='disc')S.discardOpen=!S.discardOpen;
 else if(a==='track')S.trackOpen=!S.trackOpen;
 else if(a.startsWith('stage:'))S.stageClosed=a.endsWith('0');
 else if(a.startsWith('toast:'))S.toastClosed=true;
 else if(a.startsWith('sheet:'))S.sheetOpen=a.endsWith('1');
 else if(a.startsWith('score:'))S.scoreOpen=a.endsWith('1');
 else if(a.startsWith('logf:'))S.logFilter=a.slice(5);
 else if(a.startsWith('mv:')){const[,i,d]=a.split(':');const o=S.witchOrder.slice();const j=+i+ +d;if(j>=0&&j<o.length){[o[+i],o[j]]=[o[j],o[+i]];S.witchOrder=o;}}
 render();
}
function bind(){
 document.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{e.preventDefault();act(el.dataset.act)});
 const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onchange=fn;};
 on('scene',e=>{S.scene=e.target.value;S.step=0;S.discardOpen=false;resetTransient();writeUrl();render();});
 on('viewer',e=>{S.viewer=e.target.value;render();});
 on('device',e=>{S.device=e.target.value;render();});
 on('drawCard',e=>{S.drawCard=e.target.value;resetTransient();render();});
 on('replaceCase',e=>{S.replaceCase=e.target.value;S.step=0;resetTransient();render();});
 on('witchLast',e=>{S.witchLast=e.target.checked;S.step=0;S.witchOrder=['19','07','14'];render();});
 on('lf-toggle',e=>{S.lobbyOn=e.target.checked;render();});
}
document.addEventListener('keydown',e=>{
 const t=e.target;if(t&&(t.matches('input,textarea,select,[contenteditable]')))return;
 if(e.key==='ArrowRight'){act('vnext');}else if(e.key==='ArrowLeft'){act('vprev');}
});
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(render,120)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1).split('-');const v=(h[0]||'').toUpperCase();if(VARIANTS[v])S.variant=v;if(SCENES[h[1]]&&h[1]!==S.scene){S.scene=h[1];S.step=0;}resetTransient();render();});
resetTransient();render();
</script>
