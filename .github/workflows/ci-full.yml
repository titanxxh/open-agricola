name: CI Full

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm run check:architecture

      - name: All tests (fast + slow)
        run: pnpm test

      - name: Build (includes cards manifest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run build

      - name: Build immutable replay viewer
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_VIEWER_ROOT: ${{ runner.temp }}/replay-viewers
        run: pnpm run build:replay-viewer

      - name: Check bundle size (strict)
        run: pnpm run check:bundle-size

      - name: Check community deck consistency
        run: pnpm run check:community-deck
