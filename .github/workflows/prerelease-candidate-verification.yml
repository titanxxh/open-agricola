name: Prerelease Candidate Verification
run-name: prerelease / ${{ inputs.candidate_sha }} / ${{ inputs.tasks }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable prerelease integration commit SHA
        required: true
        type: string
      candidate_ref:
        description: Protected verification/prerelease/<SHA> reference
        required: true
        type: string
      tasks:
        description: Complete catalog task IDs, comma-separated, or all
        default: all
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: prerelease-candidate-${{ inputs.candidate_sha }}-${{ inputs.tasks }}
  cancel-in-progress: false

jobs:
  manifest:
    name: candidate-manifest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.manifest.outputs.sha }}
      configuration: ${{ steps.manifest.outputs.configuration }}
      matrix: ${{ steps.manifest.outputs.matrix }}
      tasks: ${{ steps.manifest.outputs.tasks }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Generate candidate manifest
        id: manifest
        working-directory: policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_TASKS: ${{ inputs.tasks }}
        run: node scripts/ci/prerelease-verification.ts manifest --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA" --ref "$CANDIDATE_REF" --tasks "$CANDIDATE_TASKS"
      - name: Prerelease manifest / ${{ steps.manifest.outputs.binding }}
        run: echo 'Repository, prerelease channel, candidate, configuration and main producer are bound'

  task:
    needs: manifest
    name: candidate / ${{ matrix.task }} / ${{ needs.manifest.outputs.configuration }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.manifest.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install trusted browser prerequisites
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        working-directory: policy
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium webkit
      - name: Prepare candidate isolation
        id: isolation
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_TEMP bash policy/scripts/ci/setup-candidate-isolation.sh "$PWD/candidate" "$PWD/policy" "$(command -v node)" "$(id -u)"
      - name: Prove native candidate isolation
        run: node policy/scripts/ci/candidate-isolation.ts smoke
      - name: Install dependencies
        run: node policy/scripts/ci/candidate-isolation.ts install
      - name: Install browsers
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        run: node policy/scripts/ci/candidate-isolation.ts browsers
      - name: Verify candidate checkout
        working-directory: policy
        env:
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
        run: node scripts/ci/prerelease-verification.ts source --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA"
      - name: Execute verification task
        working-directory: policy
        env:
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
          VERIFICATION_TASK: ${{ matrix.task }}
        run: node scripts/ci/prerelease-verification.ts run-task --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA" --task "$VERIFICATION_TASK"
      - name: Stop candidate descendants and collect private diagnostics
        if: always() && steps.isolation.outcome == 'success'
        env:
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
        run: node policy/scripts/ci/candidate-isolation.ts finish "$PWD/candidate" "$CANDIDATE_SHA"
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.task }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/candidate-isolation/

  complete:
    name: candidate-complete
    if: always()
    needs: [manifest, task]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every selected candidate task
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          TASK_RESULT: ${{ needs.task.result }}
          VERIFIED_SHA: ${{ needs.manifest.outputs.sha }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ "$MANIFEST_RESULT" != success || "$TASK_RESULT" != success || "$VERIFIED_SHA" != "$EXPECTED_SHA" ]]; then
            echo 'Prerelease candidate verification did not complete' >&2
            exit 1
          fi
