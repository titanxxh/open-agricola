name: Deploy Frontend to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, ui]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_deploy: ${{ steps.filter.outputs.changed }}
      head_sha: ${{ steps.filter.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: filter
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -E '^(client/|shared/|public/|index\.html|vite\.config\.ts|package\.json|\.github/workflows/deploy-pages\.yml)' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.should_deploy == 'true' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
          VITE_BASE_PATH: /open-agricola/
          BGA_CDN_BASE_URL: ${{ vars.BGA_CDN_BASE_URL }}
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
