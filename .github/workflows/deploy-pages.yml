name: Deploy Frontend to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/checkout@v6
        with:
          repository: bga-devs/bga-agricola
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
          ref: 20397289f6b82ec9667a13e7803ca3038eeb6bb6
          path: bga-agricola
          sparse-checkout: img

      - name: Build frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
          VITE_BASE_PATH: /open-agricola/
          BGA_CDN_BASE_URL: ${{ vars.BGA_CDN_BASE_URL }}
          VITE_SANDBOX_EXECUTOR: ${{ vars.VITE_SANDBOX_EXECUTOR }}
          BGA_IMAGE_DIR: bga-agricola/img
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
