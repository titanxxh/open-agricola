name: Candidate Verification
run-name: stable / ${{ inputs.candidate_sha }} / ${{ inputs.tasks }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Final merged main candidate commit SHA
        required: true
        type: string
      tasks:
        description: Complete catalog task IDs, comma-separated, or all
        default: all
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: stable-candidate-${{ inputs.candidate_sha }}-${{ inputs.tasks }}
  cancel-in-progress: false

jobs:
  manifest:
    name: candidate-manifest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.manifest.outputs.sha }}
      configuration: ${{ steps.manifest.outputs.configuration }}
      matrix: ${{ steps.manifest.outputs.matrix }}
      tasks: ${{ steps.manifest.outputs.tasks }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: policy
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Generate candidate manifest
        id: manifest
        working-directory: policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TASKS: ${{ inputs.tasks }}
        run: node scripts/ci/candidate-verification.ts formal-manifest --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA" --tasks "$CANDIDATE_TASKS"
      - name: Stable manifest / ${{ steps.manifest.outputs.binding }}
        run: echo 'Repository, stable channel, candidate, configuration and main producer are bound'

  task:
    needs: manifest
    name: candidate / ${{ matrix.task }} / ${{ needs.manifest.outputs.configuration }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - name: Checkout trusted main policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.manifest.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Verify candidate checkout
        working-directory: policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
        run: node scripts/ci/candidate-verification.ts formal-source --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA"
      - name: Key trusted browser system packages
        id: browser-packages-key
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        working-directory: policy
        run: |
          playwright=$(grep -m1 -oE '^  playwright@[0-9][^:(]*' pnpm-lock.yaml | cut -d@ -f2)
          [ -n "$playwright" ] || { echo 'pnpm-lock.yaml names no playwright version' >&2; exit 1; }
          prefix="browser-system-packages-v1-$(. /etc/os-release && echo "$ID-$VERSION_ID")-$(uname -m)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$playwright" >> "$GITHUB_OUTPUT"
      - name: Restore trusted browser system packages
        id: browser-packages
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/browser-system-packages
          key: ${{ steps.browser-packages-key.outputs.key }}
          restore-keys: ${{ steps.browser-packages-key.outputs.prefix }}
      - name: Install trusted browser prerequisites
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        working-directory: policy
        env:
          APT_ARCHIVES: ${{ runner.temp }}/browser-system-packages
        run: |
          pnpm install --frozen-lockfile
          bash scripts/ci/install-browser-system-packages.sh "$APT_ARCHIVES"
      - name: Save trusted browser system packages
        if: (startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit') && steps.browser-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/browser-system-packages
          key: ${{ steps.browser-packages-key.outputs.key }}
      - name: Checkout pinned public assets
        id: public-assets
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        run: bash policy/scripts/ci/checkout-public-assets.sh candidate "$RUNNER_TEMP/public-assets"
      - name: Prepare candidate isolation
        id: isolation
        env:
          PUBLIC_ASSETS: ${{ steps.public-assets.outputs.directory }}
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_TEMP bash policy/scripts/ci/setup-candidate-isolation.sh "$PWD/candidate" "$PWD/policy" "$(command -v node)" "$(id -u)" "$PUBLIC_ASSETS"
      - name: Prove native candidate isolation
        run: node policy/scripts/ci/candidate-isolation.ts smoke
      - name: Install dependencies
        run: node policy/scripts/ci/candidate-isolation.ts install
      - name: Install browsers
        if: startsWith(matrix.task, 'chromium-') || matrix.task == 'browser-sandbox' || matrix.task == 'webkit'
        run: node policy/scripts/ci/candidate-isolation.ts browsers
      - name: Pull task fixture images
        if: startsWith(matrix.task, 'chromium-')
        working-directory: policy
        env:
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
          VERIFICATION_TASK: ${{ matrix.task }}
        run: node scripts/ci/candidate-verification.ts pull-fixture-images "$VERIFICATION_TASK" --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA"
      - name: Execute verification task
        working-directory: policy
        env:
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
          VERIFICATION_TASK: ${{ matrix.task }}
          # Two worktree lanes per chromium task (#1920, #1921); the task command and so the receipt stay the same.
          VERIFY_PARALLEL_LANES: '2'
        run: node scripts/ci/candidate-verification.ts formal-run-task "$VERIFICATION_TASK" --candidate-directory ../candidate --sha "$CANDIDATE_SHA" --producer "$GITHUB_SHA"
      - name: Stop candidate descendants and collect private diagnostics
        if: always() && steps.isolation.outcome == 'success'
        env:
          CANDIDATE_SHA: ${{ needs.manifest.outputs.sha }}
        run: node policy/scripts/ci/candidate-isolation.ts finish "$PWD/candidate" "$CANDIDATE_SHA"
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.task }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/candidate-isolation/

  complete:
    name: candidate-complete
    if: always()
    needs: [manifest, task]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every selected candidate task
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          TASK_RESULT: ${{ needs.task.result }}
          VERIFIED_SHA: ${{ needs.manifest.outputs.sha }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ "$MANIFEST_RESULT" != success || "$TASK_RESULT" != success || "$VERIFIED_SHA" != "$EXPECTED_SHA" ]]; then
            echo 'Stable candidate verification did not complete' >&2
            exit 1
          fi
