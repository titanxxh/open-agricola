name: Verification Scope

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preview verification scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx scripts/verification-plan.ts --base "$BASE_REF" --head "$HEAD_REF"

      - name: Retain verification scope plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: output/verification/plan.json
