name: E2E

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E (Chromium)
        run: pnpm run verify

      - name: Browser-local sandbox
        run: pnpm run verify:e2e:browser-sandbox

      - name: iOS Safari smoke (WebKit)
        run: pnpm run verify:e2e:webkit
