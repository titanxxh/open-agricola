name: E2E

# Pull requests run browser E2E on the author's machine (`pnpm verify <spec>`) and
# record the result in the PR; see docs/operations/ci-checks.md.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: chromium-1
            command: pnpm verify --shard=1/4
          - lane: chromium-2
            command: pnpm verify --shard=2/4
          - lane: chromium-3
            command: pnpm verify --shard=3/4
          - lane: chromium-4
            command: pnpm verify --shard=4/4
          - lane: browser-sandbox
            command: pnpm run verify:e2e:browser-sandbox
          - lane: webkit
            command: pnpm run verify:e2e:webkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E (${{ matrix.lane }})
        run: ${{ matrix.command }}

      - name: Retain browser readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-readiness-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/verification/*.json
            output/playwright/**/session-lifecycle.json
            output/playwright/**/session-failure.json
            output/playwright/**/session-failure.png
            output/playwright/**/operations-panel-queries.json
            output/playwright/**/operations-panel-visibility.json
            output/playwright/**/operations-*.log
