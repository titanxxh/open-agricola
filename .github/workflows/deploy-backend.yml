name: Deploy Backend

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'open-agricola.duckdns.org' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
  DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/root/open-agricola' }}
  DEPLOY_REF: ${{ github.event.release.tag_name || 'main' }}
  ACCOUNT_REGISTRATION_POLICY: ${{ vars.ACCOUNT_REGISTRATION_POLICY }}

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "DEPLOY_SSH_PRIVATE_KEY secret is required" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          chmod +x ./deploy-backend.sh
          ./deploy-backend.sh "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_REF" "$DEPLOY_REMOTE_DIR"

      - name: Verify deployed build
        run: |
          DEPLOYED_BUILD_ID="$(
            ssh -n "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_REMOTE_DIR' && docker compose -f docker-compose.prod.yml exec -T app sh -c 'printf \"%s\" \"\$GAME_BUILD_ID\"'"
          )"
          if [ "$DEPLOYED_BUILD_ID" != "$GITHUB_SHA" ]; then
            echo "deployed build mismatch: expected $GITHUB_SHA, got ${DEPLOYED_BUILD_ID:-empty}" >&2
            exit 1
          fi
