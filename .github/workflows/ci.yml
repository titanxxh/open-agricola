name: CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full comparison base SHA for a manual scope probe
        required: false
        default: ''
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      partitions: ${{ steps.plan.outputs.partitions }}
      catalog_tasks: ${{ steps.plan.outputs.catalog_tasks }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate manual comparison base
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPARISON_BASE: ${{ inputs.base_sha }}
        run: |
          if [[ -n "$COMPARISON_BASE" && ! "$COMPARISON_BASE" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'The manual comparison base must be a full lowercase commit SHA' >&2
            exit 1
          fi
      - name: Compute canonical verification plan
        id: plan
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx scripts/ci/scoped-verification.ts plan --base "$BASE_REF" --head "$HEAD_REF"
      - name: Retain verification plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: output/verification/scoped-plan.json

  units:
    needs: plan
    if: needs.plan.outputs.partitions != '' && fromJSON(needs.plan.outputs.partitions)['units'] != null
    uses: ./.github/workflows/scoped-verification.yml
    with:
      partition: units
      base_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}

  browser-1:
    needs: plan
    if: needs.plan.outputs.partitions != '' && fromJSON(needs.plan.outputs.partitions)['browser-1'] != null
    uses: ./.github/workflows/scoped-verification.yml
    with:
      partition: browser-1
      base_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}

  browser-2:
    needs: plan
    if: needs.plan.outputs.partitions != '' && fromJSON(needs.plan.outputs.partitions)['browser-2'] != null
    uses: ./.github/workflows/scoped-verification.yml
    with:
      partition: browser-2
      base_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}

  browser-3:
    needs: plan
    if: needs.plan.outputs.partitions != '' && fromJSON(needs.plan.outputs.partitions)['browser-3'] != null
    uses: ./.github/workflows/scoped-verification.yml
    with:
      partition: browser-3
      base_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}

  browser-4:
    needs: plan
    if: needs.plan.outputs.partitions != '' && fromJSON(needs.plan.outputs.partitions)['browser-4'] != null
    uses: ./.github/workflows/scoped-verification.yml
    with:
      partition: browser-4
      base_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
      head_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}

  catalog:
    needs: plan
    if: needs.plan.outputs.catalog_tasks != '' && needs.plan.outputs.catalog_tasks != 'none'
    uses: ./.github/workflows/candidate-verification.yml
    with:
      candidate_sha: ${{ github.sha }}
      tasks: ${{ needs.plan.outputs.catalog_tasks }}

  verify:
    name: verify
    if: always()
    needs: [plan, units, browser-1, browser-2, browser-3, browser-4, catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require every selected check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: pnpm exec tsx scripts/ci/scoped-verification.ts gate --sha "$GITHUB_SHA"
