name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ui]
  workflow_dispatch:

jobs:
  check-prompt-sync:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check prompt sync (strict)
        run: pnpm run check:prompt-sync -- --strict

  llm-cards-record:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: LLM card-gen (record mode)
        run: pnpm test:llm

  verify:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Lint i18n (no missing keys)
        run: pnpm run lint:i18n

      - name: Unit tests (fast tier)
        run: pnpm run test:fast

      - name: Check direct session log writes
        run: pnpm run check:direct-session-log

      - name: Check effects file list
        run: pnpm run check:effects-file-list

      - name: Check generated card catalog sync
        run: pnpm run check:generated-cards-sync

      - uses: actions/checkout@v6
        with:
          repository: bga-devs/bga-agricola
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
          ref: 20397289f6b82ec9667a13e7803ca3038eeb6bb6
          path: bga-agricola
          sparse-checkout: img

      - name: Build (includes cards manifest)
        env:
          BGA_IMAGE_DIR: bga-agricola/img
        run: pnpm run build

      - name: Build immutable replay viewer
        env:
          BGA_IMAGE_DIR: bga-agricola/img
          REPLAY_VIEWER_ROOT: ${{ runner.temp }}/replay-viewers
        run: pnpm run build:replay-viewer

      - name: Check reaches (strict)
        run: pnpm run check:reaches -- --strict

      - name: Check no-DSL (strict — DSL path fully removed)
        run: pnpm run check:no-dsl -- --strict

      - name: Check card implementation boundaries
        run: pnpm run check:card-impl-boundaries

      - name: Check bundle size (strict)
        run: pnpm run check:bundle-size

      - name: Check catalog types (issue #10)
        run: pnpm run check:catalog-types

      - name: Check community deck consistency
        run: pnpm run check:community-deck
