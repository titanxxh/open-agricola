name: CI

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full comparison base SHA for a manual scope probe
        required: false
        default: ''
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      inline_checks: ${{ steps.plan.outputs.inline_checks }}
      catalog_tasks: ${{ steps.plan.outputs.catalog_tasks }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate manual comparison base
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPARISON_BASE: ${{ inputs.base_sha }}
        run: |
          if [[ -n "$COMPARISON_BASE" && ! "$COMPARISON_BASE" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'The manual comparison base must be a full lowercase commit SHA' >&2
            exit 1
          fi
      - name: Compute canonical verification plan
        id: plan
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm exec tsx scripts/ci/scoped-verification.ts plan --base "$BASE_REF" --head "$HEAD_REF"
      - name: Retain verification plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: output/verification/scoped-plan.json

  inline:
    needs: plan
    if: needs.plan.outputs.inline_checks != '0' && needs.plan.outputs.inline_checks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.execute.outputs.status }}
      plan_digest: ${{ steps.execute.outputs.plan_digest }}
      tested_sha: ${{ steps.execute.outputs.tested_sha }}
      completed_checks: ${{ steps.execute.outputs.completed_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: contains(needs.plan.outputs.browsers, 'chromium')
        run: pnpm exec playwright install --with-deps chromium
      - name: Install WebKit
        if: contains(needs.plan.outputs.browsers, 'webkit')
        run: pnpm exec playwright install --with-deps webkit
      - name: Execute selected file and browser checks
        id: execute
        env:
          BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/ci/scoped-verification.ts run --base "$BASE_REF" --head "$HEAD_REF" --partition inline --expected-digest "$EXPECTED_PLAN_DIGEST"
      - name: Retain selected verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoped-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/verification/**
            output/playwright/**/session-lifecycle.json
            output/playwright/**/session-failure.json

  catalog:
    needs: plan
    if: needs.plan.outputs.catalog_tasks != ''
    uses: ./.github/workflows/candidate-verification.yml
    with:
      candidate_sha: ${{ github.sha }}
      tasks: ${{ needs.plan.outputs.catalog_tasks }}

  verify:
    name: verify
    if: always()
    needs: [plan, inline, catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require every selected check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: pnpm exec tsx scripts/ci/scoped-verification.ts gate --sha "$GITHUB_SHA"
