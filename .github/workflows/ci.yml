name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-prompt-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check prompt sync (strict)
        run: pnpm run check:prompt-sync -- --strict

  llm-cards-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: LLM card-gen (record mode)
        run: pnpm test:llm

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm run check:architecture

      - name: Lint i18n (no missing keys)
        run: pnpm run lint:i18n

      - name: Unit tests (fast tier)
        run: pnpm run test:fast

      - name: Build (includes cards manifest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run build

      - name: Build immutable replay viewer
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_VIEWER_ROOT: ${{ runner.temp }}/replay-viewers
        run: pnpm run build:replay-viewer

      - name: Check bundle size (strict)
        run: pnpm run check:bundle-size

      - name: Check community deck consistency
        run: pnpm run check:community-deck
