name: Feature request
description: 提出新功能或改进建议
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述当前的痛点或缺失的能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充说明
